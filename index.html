<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Code-Barres</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: white;
      color: black;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      overflow: hidden;
    }

    h1 {
      margin: 10px;
      font-size: 1.2rem;
    }

    #video {
      width: 100%;
      height: auto;
      object-fit: cover;
    }

    .scanner-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 3/4;
      overflow: hidden;
      border: 2px solid red;
      border-radius: 8px;
      background: #eee;
    }

    .scan-area {
      position: absolute;
      top: 25%;
      left: 10%;
      width: 80%;
      height: 30%;
      border: 2px solid red;
      box-sizing: border-box;
      border-radius: 4px;
    }

    /* ligne rouge animée (désactivée par défaut) */
    .scan-line {
      position: absolute;
      left: 10%;
      width: 80%;
      height: 2px;
      background: red;
      display: none;
    }

    .scan-line.active {
      display: block;
      animation: moveLine 2s linear infinite;
    }

    @keyframes moveLine {
      0% { top: 25%; }
      100% { top: 55%; }
    }

    #barcode {
      margin-top: 15px;
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
    }

    button {
      margin-top: 10px;
      padding: 8px 16px;
      background: red;
      border: none;
      color: white;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    #product {
      margin-top: 20px;
      padding: 10px;
      max-width: 400px;
      background: #f8f8f8;
      border-radius: 8px;
      text-align: left;
    }
  </style>
</head>
<body>
  <h1>Scanner un Code-Barres</h1>

  <div class="scanner-container">
    <video id="video" playsinline></video>
    <div class="scan-area"></div>
    <div class="scan-line" id="scanLine"></div>
  </div>

  <button id="startBtn">Démarrer le scan</button>
  <button id="stopBtn">Arrêter</button>

  <div id="barcode">Aucun code détecté</div>

  <div id="product"></div>

  <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
  <script>
    const video = document.getElementById("video");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const barcodeEl = document.getElementById("barcode");
    const productEl = document.getElementById("product");
    const scanLine = document.getElementById("scanLine");

    let codeReader = null;
    let scanning = false;

    async function startScan() {
      barcodeEl.textContent = "Démarrage de la caméra...";
      productEl.textContent = "";
      scanLine.classList.add("active");

      if (!codeReader) codeReader = new ZXing.BrowserMultiFormatReader();

      try {
        const devices = await ZXing.BrowserMultiFormatReader.listVideoInputDevices();
        const deviceId = devices.length > 1 ? devices[1].deviceId : devices[0].deviceId;

        barcodeEl.textContent = "Scan en cours...";
        scanning = true;

        codeReader.decodeFromVideoDevice(deviceId, video, async (result, err) => {
          if (result) {
            const code = result.text;
            barcodeEl.textContent = "Code détecté : " + code;

            if (scanning) {
              scanning = false;
              await fetchProductData(code);
            }
          }
        });
      } catch (e) {
        console.error(e);
        barcodeEl.textContent = "Erreur : " + e.message;
      }
    }

    async function fetchProductData(code) {
      try {
        productEl.textContent = "Recherche du produit...";
        const response = await fetch(`https://world.openfoodfacts.org/api/v0/product/${code}.json`);
        const data = await response.json();

        if (data.status === 1) {
          const p = data.product;
          productEl.innerHTML = `
            <h3>${p.product_name || "Nom inconnu"}</h3>
            <p><strong>Marque :</strong> ${p.brands || "N/A"}</p>
            <p><strong>Énergie :</strong> ${p.nutriments["energy-kcal"] || "?"} kcal</p>
            <p><strong>Sucres :</strong> ${p.nutriments.sugars || "?"} g</p>
            <p><strong>Lipides :</strong> ${p.nutriments.fat || "?"} g</p>
            <p><strong>Glucides :</strong> ${p.nutriments.carbohydrates || "?"} g</p>
            <p><strong>Protéines :</strong> ${p.nutriments.proteins || "?"} g</p>
          `;
        } else {
          productEl.textContent = "Produit introuvable dans Open Food Facts.";
        }

        // relancer le scan
        setTimeout(() => {
          scanning = true;
        }, 2000);

      } catch (err) {
        productEl.textContent = "Erreur lors de la récupération des données.";
        console.error(err);
      }
    }

    function stopScan() {
      if (codeReader) codeReader.reset();
      scanLine.classList.remove("active");
      scanning = false;
      barcodeEl.textContent += " — Scan arrêté.";
    }

    startBtn.addEventListener("click", startScan);
    stopBtn.addEventListener("click", stopScan);
  </script>
</body>
</html>
