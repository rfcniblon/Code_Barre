<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Scanner de Code-Barres</title>
</head>
<body>
  <h2>Scanner un produit</h2>
  <div id="scanner-container"></div>
  <p id="result">Résultat : aucun</p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
  <script>
    Quagga.init({
      inputStream: {
        name: "Live",
        type: "LiveStream",
        target: document.querySelector('#scanner-container'),
      },
      decoder: {
        readers: ["ean_reader"] // "ean_reader" pour les codes-barres de produits alimentaires
      }
    }, function(err) {
      if (err) {
        console.log(err);
        return;
      }
      console.log("Scanner prêt !");
      Quagga.start();
    });

    Quagga.onDetected(function(result) {
      const code = result.codeResult.code;
      document.getElementById('result').textContent = "Code-barres détecté : " + code;
      console.log("Code détecté :", code);
      Quagga.stop();
    });
  </script>
</body>
</html>
