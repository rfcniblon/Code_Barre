<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Code-Barres • OpenFoodFacts</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      overflow: hidden;
    }

    h1 {
      margin: 10px;
      font-size: 1.3rem;
      text-align: center;
    }

    #video {
      width: 100%;
      height: auto;
      object-fit: cover;
    }

    .scanner-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 3/4;
      overflow: hidden;
      border: 2px solid red;
      border-radius: 8px;
    }

    /* zone de scan centrale */
    .scan-area {
      position: absolute;
      top: 25%;
      left: 10%;
      width: 80%;
      height: 30%;
      border: 2px solid red;
      box-sizing: border-box;
      border-radius: 4px;
    }

    /* ligne laser */
    .scan-line {
      position: absolute;
      top: 25%;
      left: 10%;
      width: 80%;
      height: 2px;
      background: red;
      animation: moveLine 2s linear infinite;
      opacity: 0.8;
    }

    @keyframes moveLine {
      0% { top: 25%; }
      100% { top: 55%; }
    }

    #barcode {
      margin-top: 15px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    button {
      margin-top: 10px;
      padding: 8px 16px;
      background: red;
      border: none;
      color: white;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .result {
      margin-top: 15px;
      background: rgba(255, 255, 255, 0.05);
      padding: 12px;
      border-radius: 8px;
      max-width: 400px;
      width: 100%;
    }

    .result img {
      width: 100%;
      max-height: 180px;
      object-fit: contain;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .info {
      text-align: left;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .info strong {
      color: #ff5c5c;
    }

  </style>
</head>
<body>
  <h1>Scanner un Code-Barres</h1>

  <div class="scanner-container">
    <video id="video" playsinline></video>
    <div class="scan-area"></div>
    <div class="scan-line"></div>
  </div>

  <button id="startBtn">Démarrer le scan</button>
  <button id="stopBtn">Arrêter</button>

  <div id="barcode">Aucun code détecté</div>

  <div class="result" id="result" style="display:none;">
    <img id="productImage" src="" alt="">
    <div class="info">
      <div><strong>Nom :</strong> <span id="productName">-</span></div>
      <div><strong>Énergie :</strong> <span id="energy">-</span></div>
      <div><strong>Glucides :</strong> <span id="carbs">-</span></div>
      <div><strong>Sucres :</strong> <span id="sugar">-</span></div>
      <div><strong>Lipides :</strong> <span id="fat">-</span></div>
      <div><strong>Protéines :</strong> <span id="protein">-</span></div>
      <div><strong>Sel :</strong> <span id="salt">-</span></div>
    </div>
  </div>

  <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
  <script>
    const video = document.getElementById("video");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const barcodeEl = document.getElementById("barcode");
    const resultBox = document.getElementById("result");
    const codeReader = new ZXing.BrowserMultiFormatReader();

    let scanning = false;
    let lastCode = null;

    async function startScan() {
      if (scanning) return;
      scanning = true;
      barcodeEl.textContent = "Initialisation de la caméra...";
      resultBox.style.display = "none";

      try {
        const devices = await ZXing.BrowserCodeReader.listVideoInputDevices();
        const deviceId = devices.length > 0 ? devices[0].deviceId : null;
        if (!deviceId) {
          barcodeEl.textContent = "Aucune caméra détectée";
          scanning = false;
          return;
        }

        barcodeEl.textContent = "Scan en cours...";

        codeReader.decodeFromVideoDevice(deviceId, video, (result, err) => {
          if (result) {
            const code = result.text.trim();
            if (code !== lastCode) {
              lastCode = code;
              barcodeEl.textContent = "Code détecté : " + code;
              fetchProductInfo(code);
            }
          }
        });
      } catch (err) {
        console.error(err);
        barcodeEl.textContent = "Erreur : " + err.message;
        scanning = false;
      }
    }

    function stopScan() {
      scanning = false;
      codeReader.reset();
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
        video.srcObject = null;
      }
      barcodeEl.textContent += " — Scan arrêté.";
    }

    async function fetchProductInfo(code) {
      const apiUrl = `https://world.openfoodfacts.org/api/v0/product/${code}.json`;
      barcodeEl.textContent = "Recherche du produit...";

      try {
        const res = await fetch(apiUrl);
        const data = await res.json();

        if (data.status === 1 && data.product) {
          const p = data.product;
          resultBox.style.display = "block";
          document.getElementById("productImage").src =
            p.image_front_small_url || p.image_url || "";
          document.getElementById("productName").textContent =
            p.product_name || "Inconnu";

          const n = p.nutriments || {};
          const get = (k) => n[k] !== undefined ? n[k] + " g" : "-";

          document.getElementById("energy").textContent =
            (n["energy-kcal_100g"] ? n["energy-kcal_100g"] + " kcal" : "-");
          document.getElementById("carbs").textContent = get("carbohydrates_100g");
          document.getElementById("sugar").textContent = get("sugars_100g");
          document.getElementById("fat").textContent = get("fat_100g");
          document.getElementById("protein").textContent = get("proteins_100g");
          document.getElementById("salt").textContent = get("salt_100g");

          barcodeEl.textContent = "Produit trouvé pour le code : " + code;
        } else {
          resultBox.style.display = "block";
          document.getElementById("productImage").src = "";
          document.getElementById("productName").textContent = "Produit non trouvé";
          barcodeEl.textContent = "Produit non trouvé dans Open Food Facts.";
        }
      } catch (err) {
        console.error(err);
        barcodeEl.textContent = "Erreur API : " + err.message;
      }
    }

    startBtn.addEventListener("click", startScan);
    stopBtn.addEventListener("click", stopScan);
  </script>
</body>
</html>
