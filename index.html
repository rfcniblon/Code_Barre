<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Code-Barres (QuaggaJS + OpenFoodFacts)</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: white;
      color: black;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      overflow: hidden;
    }

    h1 {
      margin: 10px;
      font-size: 1.2rem;
    }

    #scanner-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 3/4;
      border: 2px solid red;
      border-radius: 8px;
      overflow: hidden;
      background: #eee;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scan-area {
      position: absolute;
      top: 25%;
      left: 10%;
      width: 80%;
      height: 30%;
      border: 2px solid red;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .scan-line {
      position: absolute;
      left: 10%;
      width: 80%;
      height: 2px;
      background: red;
      display: none;
    }

    .scan-line.active {
      display: block;
      animation: moveLine 2s linear infinite;
    }

    @keyframes moveLine {
      0% { top: 25%; }
      100% { top: 55%; }
    }

    #barcode {
      margin-top: 15px;
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
    }

    button {
      margin-top: 10px;
      padding: 8px 16px;
      background: red;
      border: none;
      color: white;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    #product {
      margin-top: 20px;
      padding: 10px;
      max-width: 400px;
      background: #f8f8f8;
      border-radius: 8px;
      text-align: left;
    }
  </style>
</head>
<body>
  <h1>Scanner un Code-Barres</h1>

  <div id="scanner-container">
    <div class="scan-area"></div>
    <div class="scan-line" id="scanLine"></div>
    <div id="interactive" class="viewport"></div>
  </div>

  <button id="startBtn">Démarrer le scan</button>
  <button id="stopBtn">Arrêter</button>

  <div id="barcode">Aucun code détecté</div>
  <div id="product"></div>

  <script src="https://unpkg.com/quagga@0.12.1/dist/quagga.min.js"></script>
  <script>
    const barcodeEl = document.getElementById("barcode");
    const productEl = document.getElementById("product");
    const scanLine = document.getElementById("scanLine");

    let scanning = false;
    let lastCode = "";

    async function startScan() {
      productEl.textContent = "";
      barcodeEl.textContent = "Initialisation du scan...";
      scanLine.classList.add("active");

      Quagga.init({
        inputStream: {
          type: "LiveStream",
          constraints: {
            facingMode: "environment" // caméra arrière
          },
          target: document.querySelector("#interactive")
        },
        decoder: {
          readers: ["ean_reader", "ean_13_reader", "upc_reader", "code_128_reader"]
        }
      }, function(err) {
        if (err) {
          console.error(err);
          barcodeEl.textContent = "Erreur d’accès à la caméra : " + err.message;
          return;
        }
        Quagga.start();
        scanning = true;
        barcodeEl.textContent = "Scan en cours...";
      });

      Quagga.onDetected(async data => {
        const code = data.codeResult.code;
        if (code && code !== lastCode) {
          lastCode = code;
          barcodeEl.textContent = "Code détecté : " + code;
          await fetchProductData(code);
        }
      });
    }

    function stopScan() {
      Quagga.stop();
      scanning = false;
      scanLine.classList.remove("active");
      barcodeEl.textContent += " — Scan arrêté.";
    }

    async function fetchProductData(code) {
      try {
        productEl.textContent = "Recherche du produit...";
        const response = await fetch(`https://world.openfoodfacts.org/api/v0/product/${code}.json`);
        const data = await response.json();

        if (data.status === 1) {
          const p = data.product;
          productEl.innerHTML = `
            <h3>${p.product_name || "Nom inconnu"}</h3>
            ${p.image_front_url ? `<img src="${p.image_front_url}" width="100%">` : ""}
            <p><strong>Marque :</strong> ${p.brands || "N/A"}</p>
            <p><strong>Énergie :</strong> ${p.nutriments["energy-kcal"] || "?"} kcal</p>
            <p><strong>Sucres :</strong> ${p.nutriments.sugars || "?"} g</p>
            <p><strong>Lipides :</strong> ${p.nutriments.fat || "?"} g</p>
            <p><strong>Glucides :</strong> ${p.nutriments.carbohydrates || "?"} g</p>
            <p><strong>Protéines :</strong> ${p.nutriments.proteins || "?"} g</p>
          `;
        } else {
          productEl.textContent = "Produit introuvable dans Open Food Facts.";
        }
      } catch (err) {
        console.error(err);
        productEl.textContent = "Erreur lors de la récupération des données.";
      }
    }

    document.getElementById("startBtn").addEventListener("click", startScan);
    document.getElementById("stopBtn").addEventListener("click", stopScan);
  </script>
</body>
</html>
